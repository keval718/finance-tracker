services:
  backend:
    build: ./backend
    environment:
      DATABASE_URL: sqlite:////data/finance.db
      SECRET_KEY: ${SECRET_KEY:-change-me-to-a-long-random-string}
    volumes:
      - db-data:/data

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  db-data:
